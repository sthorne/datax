name: ci
on:
  push:
    # 'claude/**' covers the working branches, which take direct pushes.
    branches: [main, master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      # Pinned (issue #142): a tool release must not turn a green build
      # red on unchanged code. Generated *.pb.go files carry the
      # "Code generated ... DO NOT EDIT." header staticcheck skips.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # Every package but the in-process cluster tests, which run in the
      # cluster job below.
      - name: test
        run: |
          set -o pipefail
          go test -race -timeout 30m $(go list ./... | grep -v '/pkg/testutils/testcluster$') 2>&1 | tee test.log
      # The cluster tests log tens of thousands of lines, and a failure
      # printed early is out of reach of tools that read a job log's tail.
      # Repeat every failure's lines at the very end.
      - name: failures
        if: failure()
        run: |
          grep -E -B5 -A40 -- '--- FAIL|^panic:|WARNING: DATA RACE|test timed out' test.log | tail -n 3000 || true

  # The in-process cluster tests are most of the suite's time, and under
  # the race detector one package outgrew the 30-minute limit. They run
  # as two jobs side by side: one takes the tests named Test[A-L]..., the
  # other skips exactly those, so every test runs once and a test added
  # later lands in one of the two whatever its name.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a-l
            select: -run '^Test[A-L]'
          - shard: m-z
            select: -skip '^Test[A-L]'
    name: cluster (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # DATAX_REQUIRE_BROWSER (issue #276): the console's browser test
      # skips where there is no Chrome, which is right on a laptop and
      # wrong here — the runner image ships one, and if that ever stops
      # being true the test must fail rather than quietly stop running.
      # DATAX_REQUIRE_PGDUMP (issue #366): likewise for pg_dump,
      # pg_restore and psql: TestPgDumpRestore must run here, not skip.
      # It runs PostgreSQL 16's tools, the release datax is tested
      # against; the runner image's default client is newer (18), whose
      # catalog queries datax does not answer yet (issue #370), so the
      # 16 client is installed beside it and DATAX_PG_DUMP names it.
      # The runner has no PGDG apt source configured, so add it with
      # postgresql-common's own script (it picks the release's codename)
      # before installing the 16 client.
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: test
        env:
          DATAX_REQUIRE_BROWSER: "1"
          DATAX_REQUIRE_PGDUMP: "1"
          DATAX_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
        run: |
          set -o pipefail
          go test -race -timeout 30m ${{ matrix.select }} ./pkg/testutils/testcluster/ 2>&1 | tee test.log
      # The cluster tests log tens of thousands of lines, and a failure
      # printed early is out of reach of tools that read a job log's tail.
      # Repeat every failure's lines at the very end.
      - name: failures
        if: failure()
        run: |
          grep -E -B5 -A40 -- '--- FAIL|^panic:|WARNING: DATA RACE|test timed out' test.log | tail -n 3000 || true
