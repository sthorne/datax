name: ci
on:
  push:
    # 'claude/**' covers the working branches, which take direct pushes.
    branches: [main, master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      # Pinned (issue #142): a tool release must not turn a green build
      # red on unchanged code. Generated *.pb.go files carry the
      # "Code generated ... DO NOT EDIT." header staticcheck skips.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # DATAX_REQUIRE_BROWSER (issue #276): the console's browser test
      # skips where there is no Chrome, which is right on a laptop and
      # wrong here — the runner image ships one, and if that ever stops
      # being true the test must fail rather than quietly stop running.
      - name: test
        env:
          DATAX_REQUIRE_BROWSER: "1"
        run: go test -race -timeout 30m ./...
