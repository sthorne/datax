name: vulncheck
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  schedule:
    # Weekly (issue #143): advisories appear against code that has not
    # changed, so a push-triggered run alone misses them until the next
    # commit.
    - cron: '41 6 * * 1'
  workflow_dispatch:

# govulncheck reports only vulnerabilities whose symbols this module
# reaches, so the job is a gate, not a warning. The tool is pinned; the
# advisory database is fetched at run time, so new advisories still
# surface against unchanged code. A reachable advisory with no fix is
# recorded as a dated exclusion where the next person will find it
# (this file), never as a permanently red build nobody reads.
# -show verbose also names the advisories in required modules whose
# symbols this module does not reach; they do not fail the gate, but a
# reviewer deciding whether one deserves action anyway needs the list,
# not the count. The toolchain line in go.mod picks the Go release the
# gate (and everything else) runs on: setup-go installs the go line's
# exact version and Go switches to the toolchain line.
#
# A scheduled run's result is written where it is read (issue #244): a
# red scheduled run files or updates one standing issue carrying the
# run's link and the tail of govulncheck's output, and a green one closes
# it. Push and pull-request runs are watched by whoever pushed; the
# schedule has no such person, which is how it was red for seven weeks.
permissions:
  contents: read
  issues: write
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        id: scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -show verbose ./... 2>&1 | tee govulncheck.out
        shell: bash -o pipefail -e {0}
      - name: standing issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/standing-issue.sh vulncheck ${{ steps.scan.outcome == 'success' && 'green' || 'red' }} govulncheck.out
