name: bench
on:
  # Paused (automatic triggers removed): the account is out of GitHub
  # Actions minutes, so every run would fail. Run by hand (workflow
  # dispatch) or locally (docs/testing.md); restore the triggers below
  # when minutes are available again.
  #   schedule:
  #     - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration_scale:
        description: multiply every workload's duration
        default: '1'

# Nightly, not per PR: hosted runners are noisy, so this is a trend line
# that catches a regression within a day when a PR skipped its own
# before/after (bench/README.md), not a gate. A failed night files or
# updates one standing issue with the run's last lines, and a clean
# night closes it (issue #244): a workload that errors — the routing
# failures of #200 and then #263 hit three nights of seven — is otherwise
# seen by nobody.
#
# What makes a night red is the exit status of the "run the workload set"
# step, and that status covers the measured runs, not only their setup
# (issue #267): bench/run.sh runs every workload against both targets and
# then fails if any workload did not complete or counted more errors than
# its tolerance (`datax bench run --max-errors`, default 0; serialization
# retries are not errors). Its last lines name each failing workload with
# its error count and most frequent error, and those are the lines the
# standing issue quotes. The summary and the artifact are produced on a
# red night too: its records are the ones somebody will want to read.
permissions:
  contents: read
  issues: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build -o bin/datax ./cmd/datax
      - name: run the workload set
        id: run
        env:
          OUT: bench-results/nightly
          DURATION_SCALE: ${{ github.event.inputs.duration_scale || '1' }}
        run: bench/run.sh 2>&1 | tee bench.out
        shell: bash -o pipefail -e {0}
      - name: summary
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          for f in bench-results/nightly/*/*.json; do
            printf '%s: ' "$f"
            jq -r '"\(.ops_per_sec) ops/s p50 \(.p50_us)us p99 \(.p99_us)us retries \(.retries) errors \(.errors) kv batches/op \(.kv_batches_per_op // "n/a")"
              + ((.error_samples // {}) | to_entries | sort_by(-.value) | .[:1]
                 | map(" (most frequent, \(.value) times: \(.key))") | join(""))' "$f"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ github.sha }}
          path: bench-results/nightly
          retention-days: 90
      - name: standing issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/standing-issue.sh bench ${{ steps.run.outcome == 'success' && 'green' || 'red' }} bench.out
